<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeLamp Demo</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <section class="stage">
        <canvas id="scene"></canvas>
        <div class="hud">
          <div><span class="label">State</span><strong id="lamp-state">BOOT</strong></div>
          <div><span class="label">Engagement</span><strong id="engagement">unknown</strong></div>
          <div><span class="label">Vision FPS</span><strong id="fps">0</strong></div>
          <div><span class="label">Last Memory</span><strong id="memory">none</strong></div>
        </div>
      </section>

      <aside class="panel">
        <h1>LeLamp</h1>
        <p class="tagline">An expressive lamp that sees, reacts, remembers, and answers from memory.</p>

        <div class="controls">
          <button id="start-camera">Start Camera</button>
          <button id="mock-engaged">Mock Engaged</button>
          <button id="mock-away">Mock Away</button>
          <button id="mock-cup">Mock Cup Memory</button>
        </div>

        <div class="talk">
          <button id="ptt">Hold to Talk</button>
          <form id="text-form">
            <input id="text-input" placeholder="Ask: Where is my cup?" />
            <button type="submit">Send</button>
          </form>
        </div>

        <section class="vision-card">
          <div class="vision-head">
            <span>Camera Object View</span>
            <strong id="det-count">0 objects</strong>
          </div>
          <div class="preview">
            <video id="cam" autoplay muted playsinline></video>
            <canvas id="overlay" width="640" height="480"></canvas>
          </div>
          <div id="detections" class="detections">Start camera to inspect detections.</div>
        </section>

        <div id="chat" class="chat"></div>
        <div id="log" class="log"></div>
      </aside>
    </main>

    <canvas id="capture" width="640" height="480" hidden></canvas>
    <audio id="reply-audio"></audio>
    <div id="toast" class="toast"></div>
    <script type="module" src="/static/lamp.js"></script>
  </body>
</html>
